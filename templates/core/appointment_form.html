{% extends 'core/base.html' %}{% load ui %}{% block content %}<section class="page-heading"><h1>{% tr 'Let’s talk about your water.' '聊聊您的用水需要。' %}</h1><p>{% tr 'Coverage is checked on the server. This enquiry does not create a contract or charge.' '服務範圍由伺服器核對；本次諮詢不產生合約或扣款。' %}</p></section><form class="form-card" data-api="/api/appointments/" data-redirect="/account/appointments/">{% csrf_token %}<div class="form-errors" role="alert"></div><label>ZIP<input name="zip" pattern="[0-9]{5}" required></label><label>{% tr 'Service address' '服務地址' %}<textarea name="address" required maxlength="500"></textarea></label><label>{% tr 'Phone' '電話' %}<input type="tel" name="phone" required maxlength="40"></label><label>{% tr 'Preferred time' '希望時間' %}<input name="preferred" required maxlength="180"></label><button class="button">{% tr 'Request a conversation' '提出諮詢預約' %}</button></form>{% endblock %}
